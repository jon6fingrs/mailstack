# mailstack: Dovecot serving a Maildir archive that mbsync fills.
#
# Everything site-specific comes from environment variables, which
# entrypoint.sh checks and exports before Dovecot starts. To add or override
# settings, mount extra *.conf files into /etc/dovecot/conf.d/.

dovecot_config_version = 2.4.5
# On-disk format: stay compatible with indexes written by Dovecot 2.4.1, so
# an existing archive can be served (and rolled back) without conversion.
dovecot_storage_version = 2.4.1

protocols = imap
# IPv4 only: Docker publishes ports over IPv4, and listening on IPv6 makes
# Dovecot refuse to start on hosts where IPv6 is disabled.
listen = *

import_environment {
  TZ = %{env:TZ}
  TLS_CERT_FILE = %{env:TLS_CERT_FILE}
  TLS_KEY_FILE = %{env:TLS_KEY_FILE}
  TIKA_URL = %{env:TIKA_URL}
}

##
## Logging: everything to the container log
##

log_path = /dev/stderr
info_log_path = /dev/stdout
# Log failed logins (never passwords).
auth_verbose = yes

##
## Login: one user, generated by entrypoint.sh into /etc/dovecot/users
##

auth_mechanisms = plain login
# Passwords only over TLS (port 993, or 143 after STARTTLS).
auth_allow_cleartext = no
# Phones reconnect often; skip re-hashing the password every time.
auth_cache_size = 1M

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

##
## Mail storage: the same layout the old dovecot container used, so existing
## UIDs, flags and indexes carry over and clients don't re-download anything.
##

mail_driver = maildir
mail_path = /mail
mail_inbox_path = /mail/INBOX
mailbox_list_layout = fs

namespace inbox {
  inbox = yes

  # Special-use flags tell clients which folder is which. Names that don't
  # exist in your archive are simply ignored.
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox "Sent Messages" {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Junk {
    special_use = \Junk
  }
  mailbox Spam {
    special_use = \Junk
  }
  mailbox Archive {
    special_use = \Archive
  }
}

# Virtual folders: live views across all real folders, nothing is copied.
# "All" is everything except Trash and Junk/Spam (searching it searches the
# whole archive); "Flagged" is every flagged message. Definitions are in
# /etc/dovecot/virtual/*/dovecot-virtual; their own small indexes are kept
# in a hidden folder inside the archive.
namespace virtual {
  prefix = Virtual/
  separator = /
  mail_driver = virtual
  mail_path = /etc/dovecot/virtual
  mail_index_path = /mail/.dovecot-virtual
  mailbox All {
    special_use = \All
    auto = subscribe
  }
  mailbox Flagged {
    special_use = \Flagged
    auto = subscribe
  }
}

##
## Full-text search: Dovecot's built-in flatcurve index (one per folder, in an
## fts-flatcurve directory next to the mail). Tika extracts text from
## attachments.
##

mail_plugins {
  fts = yes
  fts_flatcurve = yes
  virtual = yes
}

fts flatcurve {
  # Words match from their start ("invo" finds "invoice"), which is what
  # search-as-you-type needs. "yes" also matches inside words ("voice" finds
  # "invoice") but makes the index about three times bigger.
  substring_search = no
}

fts_decoder_driver = tika
fts_decoder_tika {
  url = $ENV:TIKA_URL
}

# Index new mail as Dovecot sees it arrive. mbsync writes straight to disk,
# which Dovecot doesn't count as a delivery, so entrypoint.sh also queues an
# index run every few minutes.
fts_autoindex = yes
# Index anything missing before answering a search, so results are complete.
fts_search_add_missing = yes
# If the index can't be used, fail the search rather than reading every
# message on disk.
fts_search_read_fallback = no

# How words are split and normalized: case and accents are ignored ("cafe"
# finds "Café"), and English words match their variants ("swimming" finds
# "swims").
language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple
language en {
  default = yes
  filters = normalizer-icu snowball english-possessive stopwords
}

##
## TLS
##

ssl = required
ssl_server {
  cert_file = $ENV:TLS_CERT_FILE
  key_file = $ENV:TLS_KEY_FILE
}

##
## IMAP
##

# Keepalive while a client sits in IDLE, so proxies and VPN tunnels don't drop
# the connection.
imap_idle_notify_interval = 30 secs

# Park idle connections in one tiny process instead of a full imap process each.
imap_hibernate_timeout = 5s
service imap {
  extra_groups = $SET:default_internal_group
  unix_listener imap-master {
    user = $SET:default_internal_user
  }
}
service imap-hibernate {
  unix_listener imap-hibernate {
    mode = 0660
    group = $SET:default_internal_group
  }
}

##
## Processes
##

# Large mailboxes and search indexing need more than the 256M default.
default_vsz_limit = 1G

# Background indexing should never slow down a client.
service indexer-worker {
  process_limit = 2
  executable = /usr/bin/nice -n 10 /dovecot/libexec/dovecot/indexer-worker
}

!include_try conf.d/*.conf
